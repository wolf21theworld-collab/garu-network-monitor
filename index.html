<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Net Monitor">

<title>ガル家 Network Monitor</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 background:#07111f;
 color:white;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

main{
 max-width:600px;
 margin:auto;
 padding:25px 16px 50px;
}

header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:20px;
}

h1{
 font-size:22px;
 margin:0;
}

.online{
 background:#163047;
 padding:7px 12px;
 border-radius:20px;
 font-size:12px;
}

.card{
 background:#111d30;
 border:1px solid #253249;
 border-radius:20px;
 padding:18px;
 margin-bottom:12px;
}

.label{
 color:#8fa2bb;
 font-size:12px;
 margin-bottom:6px;
}

.status{
 font-size:18px;
 font-weight:bold;
}

.dot{
 display:inline-block;
 width:10px;
 height:10px;
 border-radius:50%;
 background:#f59e0b;
 margin-right:8px;
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

.value{
 font-size:30px;
 font-weight:bold;
}

.unit{
 font-size:12px;
 color:#8fa2bb;
 margin-left:3px;
}

button{
 width:100%;
 padding:17px;
 border:none;
 border-radius:17px;
 margin-top:10px;
 background:white;
 color:#07111f;
 font-size:17px;
 font-weight:bold;
}

button:disabled{
 opacity:.5;
}

.progress{
 height:7px;
 background:#27364e;
 border-radius:10px;
 margin-top:15px;
 overflow:hidden;
}

.bar{
 width:0%;
 height:100%;
 background:white;
 transition:.2s;
}

.log{
 color:#9fb0c6;
 font-size:12px;
 margin-top:12px;
 line-height:1.5;
}

footer{
 text-align:center;
 color:#667991;
 font-size:11px;
 margin-top:20px;
}
</style>
</head>

<body>

<main>

<header>
<h1>📡 ガル家 Network Monitor</h1>
<div class="online" id="online">確認中</div>
</header>

<div class="card">
<div class="label">NETWORK STATUS</div>
<div class="status">
<span class="dot" id="dot"></span>
<span id="status">待機中</span>
</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="log" id="log">
測定開始を押してください
</div>
</div>

<div class="grid">

<div class="card">
<div class="label">DOWNLOAD</div>
<span class="value" id="download">--</span>
<span class="unit">Mbps</span>
</div>

<div class="card">
<div class="label">UPLOAD</div>
<span class="value" id="upload">--</span>
<span class="unit">Mbps</span>
</div>

<div class="card">
<div class="label">LATENCY</div>
<span class="value" id="ping">--</span>
<span class="unit">ms</span>
</div>

<div class="card">
<div class="label">JITTER</div>
<span class="value" id="jitter">--</span>
<span class="unit">ms</span>
</div>

</div>

<div class="card">
<div class="label">DEVICE</div>
<div id="device">iPhone / Safari</div>
<div class="log">
V1：現在のスマホからインターネットまでの回線品質を測定します。
</div>
</div>

<button id="start">測定開始</button>

<footer>
Garu Network Monitor V1
</footer>

</main>

<script>

const $ = id => document.getElementById(id);

const DOWN =
"https://speed.cloudflare.com/__down";

function state(text,color){
 $("status").textContent=text;
 $("dot").style.background=color;
}

function progress(n){
 $("bar").style.width=n+"%";
}

function number(n){
 if(!Number.isFinite(n)) return "--";
 return n >= 100 ? n.toFixed(0) : n.toFixed(1);
}

$("online").textContent =
 navigator.onLine ? "ONLINE" : "OFFLINE";

async function timedDownload(bytes){

 const start=performance.now();

 const response=await fetch(
  DOWN+"?bytes="+bytes+"&cache="+Math.random(),
  {cache:"no-store"}
 );

 if(!response.ok)
  throw new Error("HTTP "+response.status);

 const data=await response.arrayBuffer();

 const seconds=
  (performance.now()-start)/1000;

 return {
  mbps:(data.byteLength*8/seconds)/1000000,
  ms:seconds*1000
 };
}

async function latency(){

 const samples=[];

 for(let i=0;i<5;i++){

  const r=await timedDownload(0);

  samples.push(r.ms);

 }

 const sorted=[...samples].sort((a,b)=>a-b);

 const ping=
  sorted[Math.floor(sorted.length/2)];

 let total=0;

 for(let i=1;i<samples.length;i++)
  total+=Math.abs(samples[i]-samples[i-1]);

 return {
  ping:ping,
  jitter:total/(samples.length-1)
 };

}

async function download(){

 const tests=[
  1000000,
  5000000,
  10000000,
  25000000
 ];

 let best=0;

 for(const size of tests){

  const r=await timedDownload(size);

  if(r.mbps>best)
   best=r.mbps;

 }

 return best;
}

/*
Safariからの純粋なアップロード速度測定は
外部測定サーバーのCORS仕様に依存するため、
V1では失敗した場合に明示表示する。
*/

async function upload(){

 const size=2000000;

 const data=new Uint8Array(size);

 const start=performance.now();

 const response=await fetch(
 "https://speed.cloudflare.com/__up",
 {
  method:"POST",
  body:data
 }
 );

 if(!response.ok)
  throw new Error();

 await response.text();

 const seconds=
  (performance.now()-start)/1000;

 return (size*8/seconds)/1000000;
}

$("start").onclick=async()=>{

 $("start").disabled=true;

 $("download").textContent="--";
 $("upload").textContent="--";
 $("ping").textContent="--";
 $("jitter").textContent="--";

 try{

  state("Latency測定中","#f59e0b");

  $("log").textContent=
   "Ping / Jitterを測定しています…";

  progress(15);

  const l=await latency();

  $("ping").textContent=
   number(l.ping);

  $("jitter").textContent=
   number(l.jitter);

  state("Download測定中","#f59e0b");

  $("log").textContent=
   "ダウンロード速度を測定しています…";

  progress(40);

  const d=await download();

  $("download").textContent=
   number(d);

  state("Upload測定中","#f59e0b");

  $("log").textContent=
   "アップロード速度を測定しています…";

  progress(75);

  try{

   const u=await upload();

   $("upload").textContent=
    number(u);

  }catch{

   $("upload").textContent="N/A";

  }

  progress(100);

  if(d>=100 && l.ping<40){

   state("回線良好","#22c55e");

  }else if(d>=30){

   state("回線状態：普通","#f59e0b");

  }else{

   state("回線が遅い可能性","#ef4444");

  }

  $("log").textContent=
   "測定完了　↓ "+
   number(d)+
   " Mbps / Ping "+
   number(l.ping)+
   " ms";

 }catch(error){

  state("測定エラー","#ef4444");

  $("log").textContent=
   "測定サーバーとの通信に失敗しました";

  progress(0);

 }

 $("start").disabled=false;

};

</script>

</body>
</html>
